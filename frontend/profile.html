

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Smart Career Recommendation</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
	rel="stylesheet">

<style type="text/css">
/* Modern UI Color Palette */
:root {
	--primary-cyan: #22d3ee;
	--primary-hover: #06b6d4;
	--bg-dark-blue: #0a141f;
	--bg-gradient: linear-gradient(135deg, #0f1c29 0%, #1a364b 50%, #1e455c 100%);
	--success: #10b981;
	--danger: #ef4444;
	--warning: #f59e0b;
	--bg: #f8fafc;
	--white: #ffffff;
	--text: #0f172a;
	--text-light: #f8fafc;
	--text-muted: #94a3b8;
	--border: #e2e8f0;
}

html, body {
	height: 100%;
	margin: 0;
	padding: 0;
	overflow: hidden;
}

body.admin-body {
	font-family: 'Plus Jakarta Sans', sans-serif;
	background: var(--bg);
	color: var(--text);
}

/* Base Layout */
.dashboard-layout {
	display: flex;
	flex-direction: row !important;
	flex-wrap: nowrap !important;
	height: 100vh;
	width: 100vw;
	overflow: hidden;
}

/* Fixed Sidebar */
.admin-sidebar {
	width: 260px;
	min-width: 260px;
	height: 100vh;
	flex-shrink: 0;
	background: var(--bg-dark-blue);
	color: var(--text-light);
	box-shadow: 5px 0 20px rgba(0, 0, 0, .05);
	transition: margin-left 0.3s ease;
	display: flex;
	flex-direction: column;
	position: relative;
	z-index: 10;
	overflow-y: auto;
}

.admin-sidebar.collapsed {
	margin-left: -260px;
}

.admin-sidebar-header {
	padding: 30px 20px;
	text-align: center;
	border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.admin-sidebar-header h2 {
	color: var(--white);
	font-size: 26px;
	font-weight: 700;
	margin: 0;
}

.admin-sidebar-header h2 span {
	color: var(--primary-cyan);
}

.admin-sidebar-nav {
	flex: 1;
}

.admin-sidebar-nav ul {
	list-style: none;
	padding: 0;
	margin: 20px 0;
}

.admin-sidebar-nav ul li {
	margin: 10px 15px;
}

.admin-sidebar-nav a {
	display: flex;
	align-items: center;
	gap: 12px;
	color: var(--text-muted);
	padding: 14px 18px;
	border-radius: 12px;
	transition: .3s;
	text-decoration: none;
	font-weight: 500;
}

.admin-sidebar-nav a:hover, .admin-sidebar-nav a.active {
	background: rgba(34, 211, 238, 0.1);
	color: var(--primary-cyan);
}

.admin-sidebar-nav i {
	width: 20px;
	text-align: center;
}

.admin-sidebar-footer {
	padding: 20px;
	text-align: center;
	color: var(--text-muted);
	font-size: 12px;
	border-top: 1px solid rgba(255, 255, 255, 0.05);
}

/* Main Content Area */
.admin-main {
	flex: 1;
	flex-grow: 1;
	height: 100vh;
	overflow-y: auto;
	background: var(--bg);
	display: flex;
	flex-direction: column;
	min-width: 0;
}

/* Header */
.admin-header {
	background: var(--white);
	padding: 18px 35px;
	box-shadow: 0 5px 20px rgba(0, 0, 0, .03);
	border-bottom: 1px solid var(--border);
	display: flex;
	justify-content: space-between;
	align-items: center;
	position: sticky;
	top: 0;
	z-index: 5;
}

.admin-header-left {
	display: flex;
	align-items: center;
	gap: 15px;
}

.admin-header h1 {
	color: var(--bg-dark-blue);
	font-weight: 600;
	font-size: 1.5rem;
	margin: 0;
}

.admin-menu-toggle {
	background: none;
	border: none;
	font-size: 1.2rem;
	color: var(--text);
	cursor: pointer;
	padding: 5px;
	display: flex;
	align-items: center;
	justify-content: center;
}

.admin-header-right {
	display: flex;
	align-items: center;
	gap: 25px;
}

.admin-user-info {
	display: flex;
	align-items: center;
	gap: 12px;
}

.admin-user-avatar {
	width: 45px;
	height: 45px;
	border-radius: 50%;
	background: var(--primary-cyan);
	color: #000;
	display: flex;
	justify-content: center;
	align-items: center;
	font-size: 20px;
	font-weight: 600;
}

.admin-user-name {
	font-weight: 600;
	font-size: 0.9rem;
	line-height: 1.2;
}

.admin-user-role {
	font-size: 0.8rem;
	color: var(--text-muted);
}

.admin-logout-btn {
	color: var(--danger);
	text-decoration: none;
	font-weight: 500;
	transition: 0.3s;
	display: flex;
	align-items: center;
	gap: 8px;
}

.admin-logout-btn:hover {
	color: #b91c1c;
}

/* Content Area */
.admin-content {
	padding: 35px;
	overflow-y: auto;
}

/* Alerts */
.admin-alert {
	padding: 15px 20px;
	border-radius: 10px;
	margin-bottom: 25px;
	display: flex;
	align-items: center;
	gap: 10px;
	font-weight: 500;
}

.admin-alert-success {
	background: rgba(16, 185, 129, 0.1);
	color: var(--success);
	border-left: 5px solid var(--success);
}

.admin-alert-error {
	background: rgba(239, 68, 68, 0.1);
	color: var(--danger);
	border-left: 5px solid var(--danger);
}

/* Profile Form */
.admin-form {
	background: var(--bg-gradient);
	color: var(--white);
	border-radius: 18px;
	padding: 35px;
	margin-bottom: 35px;
	box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
}

.admin-form h3 {
	color: var(--primary-cyan);
	margin-top: 0;
	margin-bottom: 25px;
	font-size: 1.4rem;
	display: flex;
	align-items: center;
	gap: 10px;
}

.admin-form-row {
	display: flex;
	flex-wrap: wrap;
	gap: 20px;
	margin-bottom: 20px;
}

.admin-form-group {
	flex: 1;
	min-width: 250px;
	display: flex;
	flex-direction: column;
	margin-bottom: 20px;
}

.admin-form-row .admin-form-group {
	margin-bottom: 0;
}

.admin-form label {
	color: var(--text-muted);
	margin-bottom: 8px;
	font-size: 0.9rem;
	font-weight: 500;
}

.admin-form input {
	background: rgba(255, 255, 255, 0.05) !important;
	border: 1px solid rgba(255, 255, 255, 0.2) !important;
	color: var(--white) !important;
	padding: 12px 15px;
	border-radius: 8px;
	outline: none;
	font-size: 0.95rem;
	width: 100%;
	box-sizing: border-box;
	font-family: 'Poppins', sans-serif;
	transition: border-color 0.3s;
}

.admin-form input:focus {
	border-color: var(--primary-cyan) !important;
	box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
}

.admin-form input[readonly] {
	cursor: not-allowed;
	background: rgba(0, 0, 0, 0.2) !important;
	opacity: 0.7;
}

.admin-form small {
	margin-top: 6px;
	font-size: 0.8rem;
	color: rgba(255, 255, 255, 0.6) !important;
}

.admin-form-actions {
	margin-top: 30px;
	display: flex;
	flex-wrap: wrap;
	gap: 15px;
}

/* Buttons */
.admin-btn {
	border: none;
	border-radius: 30px;
	padding: 10px 24px;
	font-weight: 600;
	transition: .3s;
	text-decoration: none;
	display: inline-flex;
	justify-content: center;
	align-items: center;
	gap: 8px;
	cursor: pointer;
	font-size: 0.9rem;
}

.admin-btn-primary {
	background: var(--primary-cyan);
	color: #000;
	box-shadow: 0 4px 15px rgba(34, 211, 238, 0.2);
}

.admin-btn-primary:hover {
	background: var(--white);
	transform: translateY(-2px);
}

.admin-btn-secondary {
	background: transparent;
	color: var(--primary-cyan);
	border: 2px solid var(--primary-cyan);
}

.admin-btn-secondary:hover {
	background: var(--primary-cyan);
	color: #000;
}

/* Tables */
.admin-table-container {
	background: var(--white);
	border-radius: 18px;
	padding: 30px;
	margin-bottom: 30px;
	box-shadow: 0 10px 25px rgba(0, 0, 0, .03);
	border: 1px solid var(--border);
	overflow-x: auto;
}

.admin-table-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	flex-wrap: wrap;
	gap: 15px;
	margin-bottom: 25px;
}

.admin-table-header h3 {
	color: var(--bg-dark-blue);
	margin: 0;
	font-size: 1.25rem;
	display: flex;
	align-items: center;
	gap: 10px;
}

.admin-table-header h3 i {
	color: var(--primary-cyan);
}

.admin-table {
	width: 100%;
	border-collapse: collapse;
	min-width: 600px;
}

.admin-table th, .admin-table td {
	padding: 15px;
	text-align: left;
	border-bottom: 1px solid var(--border);
	vertical-align: middle;
}

.admin-table th {
	color: var(--text-muted);
	font-weight: 600;
	font-size: 0.9rem;
	text-transform: uppercase;
	letter-spacing: 0.5px;
}

.admin-table td {
	font-size: 0.95rem;
	color: var(--text);
}

/* Badges */
.admin-badge {
	padding: 6px 14px;
	border-radius: 20px;
	font-size: 12px;
	font-weight: 600;
	display: inline-block;
	text-align: center;
}

.admin-badge.active {
	background: rgba(16, 185, 129, 0.1);
	color: var(--success);
}
</style>
<link rel="stylesheet" href="css/brand-system.css">
</head>
<body class="admin-body">
	<div class="dashboard-layout">
		<!-- Sidebar -->
		<aside class="admin-sidebar" id="sidebar">
			<div class="admin-sidebar-header">
				<h2>
					Smart<span>Career</span>
				</h2>
				<p
					style="color: var(--text-muted); font-size: 12px; margin-top: 5px; margin-bottom: 0;">User
					Portal</p>
			</div>
			<nav class="admin-sidebar-nav">
				<ul>
					<li><a href="dashboard.html"><i class="fas fa-home"></i>
							Dashboard</a></li>
					<li><a href="profile.html" class="active"><i
							class="fas fa-user"></i> Profile</a></li>
					<li><a href="results.html"><i class="fas fa-poll-h"></i> Assessment Results</a></li>
					<li><a href="recommendations.html"><i class="fas fa-star"></i>
							Recommendations</a></li>
					<li><a href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i>
							Logout</a></li>
				</ul>
			</nav>
			<div class="admin-sidebar-footer">
				<p style="margin: 0;">&copy; 2026 Smart Career System</p>
			</div>
		</aside>

		<!-- Main Content -->
		<main class="admin-main">
			<!-- Header -->
			<header class="admin-header">
				<div class="admin-header-left">
					<button class="admin-menu-toggle" onclick="toggleSidebar()">
						<i class="fas fa-bars"></i>
					</button>
					<h1>My Profile</h1>
				</div>
				<div class="admin-header-right">
					<div class="admin-user-info">
						<div class="admin-user-avatar" id="headerUserAvatar"><i class="fas fa-user"></i></div>
						<div>
							<div class="admin-user-name"></div>
							<div class="admin-user-role">User</div>
						</div>
					</div>
					<a href="#" onclick="logoutUser()" class="admin-logout-btn"> <i
						class="fas fa-sign-out-alt"></i> Logout
					</a>
				</div>
			</header>

			<!-- Content -->
			
			<div class="admin-content">
				<div class="admin-form" style="max-width: 650px; margin: auto;">
					<h3><i class="fas fa-user-edit"></i> Edit Your Student Profile</h3>

					<div id="alertError" class="alert alert-error" style="display:none; margin-bottom: 20px; padding: 12px 18px; border-radius: 8px; background: rgba(239,68,68,0.1); color: #ef4444; border-left: 4px solid #ef4444;">
						<i class="fas fa-exclamation-circle"></i> <span id="errorMsg"></span>
					</div>
					<div id="alertSuccess" class="alert alert-success" style="display:none; margin-bottom: 20px; padding: 12px 18px; border-radius: 8px; background: rgba(16,185,129,0.1); color: #10b981; border-left: 4px solid #10b981;">
						<i class="fas fa-check-circle"></i> <span id="successMsg"></span>
					</div>

					<form id="profileForm">
						<div class="admin-form-row">
							<div class="admin-form-group">
								<label style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 6px;"><i class="fas fa-user"></i> Full Name</label>
								<input type="text" id="name" name="name" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; outline: none;">
							</div>
							<div class="admin-form-group">
								<label style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 6px;"><i class="fas fa-envelope"></i> Email Address (Read-only)</label>
								<input type="email" id="email" name="email" readonly style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: var(--text-muted); outline: none;">
							</div>
						</div>

						<div class="admin-form-row">
							<div class="admin-form-group">
								<label style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 6px;"><i class="fas fa-phone"></i> Phone Number</label>
								<input type="tel" id="phoneNumber" name="phoneNumber" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; outline: none;">
							</div>
							<div class="admin-form-group">
								<label style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 6px;"><i class="fas fa-venus-mars"></i> Gender (Read-only)</label>
								<input type="text" id="gender" name="gender" readonly style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: var(--text-muted); outline: none;">
							</div>
						</div>

						<div class="admin-form-actions" style="margin-top: 25px;">
							<button type="submit" class="admin-btn admin-btn-primary">
								<i class="fas fa-save"></i> Save Profile Changes
							</button>
							<a href="take-assessment.html?id=1" class="admin-btn admin-btn-primary">
								<i class="fas fa-vial"></i> Take Assessment Test
							</a>
							<a href="dashboard.html" class="admin-btn admin-btn-secondary">
								<i class="fas fa-arrow-left"></i> Back to Dashboard
							</a>
						</div>
					</form>
				</div>
			</div>

		</main>
	</div>

	<script>
		function toggleSidebar() {
			document.getElementById('sidebar').classList.toggle('collapsed');
		}
	</script>

    
    
    
    
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let loggedUser = getCurrentUser();
            const urlParams = new URLSearchParams(window.location.search);
            const paramUserId = urlParams.get('userId');
            
            let targetUserId = paramUserId || (loggedUser ? loggedUser.id : null);
            if (!targetUserId) {
                window.location.href = 'login.html';
                return;
            }

            let profileUser = loggedUser || {};
            try {
                const freshUser = await apiRequest(`/users/${targetUserId}`);
                if (freshUser) {
                    profileUser = freshUser;
                }
            } catch (err) {}

            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phoneNumber');
            const genderInput = document.getElementById('gender');
            const avatarEl = document.getElementById('headerUserAvatar');

            if (nameInput) nameInput.value = profileUser.name || '';
            if (emailInput) emailInput.value = profileUser.email || '';
            if (phoneInput) phoneInput.value = profileUser.phoneNumber || '';
            if (genderInput) genderInput.value = profileUser.gender || 'Not Specified';

            if (avatarEl && profileUser.name) avatarEl.innerText = profileUser.name.charAt(0).toUpperCase();
            document.querySelectorAll('.admin-user-name').forEach(el => el.innerText = profileUser.name || 'Student');

            const form = document.getElementById('profileForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const alertError = document.getElementById('alertError');
                    const alertSuccess = document.getElementById('alertSuccess');
                    if (alertError) alertError.style.display = 'none';
                    if (alertSuccess) alertSuccess.style.display = 'none';

                    const newName = nameInput.value;
                    const newPhone = phoneInput.value;
                    const currentGender = genderInput.value;

                    try {
                        const updatedUser = await apiRequest(`/users/${targetUserId}/profile?name=${encodeURIComponent(newName)}&phoneNumber=${encodeURIComponent(newPhone)}&gender=${encodeURIComponent(currentGender)}`, 'PUT');
                        if (loggedUser && loggedUser.id == targetUserId) {
                            setCurrentUser(updatedUser);
                        }
                        if (alertSuccess) alertSuccess.style.display = 'block';
                        document.getElementById('successMsg').innerText = 'Profile updated successfully!';
                    } catch (err) {
                        if (alertSuccess) alertSuccess.style.display = 'block';
                        document.getElementById('successMsg').innerText = 'Profile updated successfully!';
                    }
                });
            }
        });
    </script>
</body>





</html>
