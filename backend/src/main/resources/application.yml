server:
  port: 8080

spring:
  application:
    name: CarrerRecommedationSystem
  datasource:
    url: jdbc:mysql://localhost:3306/careerrecommendationsystem
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  web:
    resources:
      static-locations: classpath:/META-INF/resources/,classpath:/static/,classpath:/resources/
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: smtp.gmail.com
    port: 587
   
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

jwt:
  secret: c21hcnRjYXJlZXJzZWNyZXRrZXlmb3Jqd3R0b2tlbmF1dGhlbnRpY2F0aW9uc2VjdXJl
  expirationMs: 86400000
